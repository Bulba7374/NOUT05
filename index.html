<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Geometry Dash × Minecraft — Бесконечный полёт и лук</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
        }

        .fullscreen-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 100;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            color: #fff;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            touch-action: manipulation;
            transition: all 0.2s;
            box-shadow: 0 2px 12px rgba(0,0,0,0.3);
        }

        .fullscreen-btn:active {
            transform: scale(0.85);
            background: rgba(255,255,255,0.3);
        }

        .game-wrapper {
            width: 100%;
            height: 100%;
            padding: 6px 8px 8px 8px;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            gap: 5px;
            border: 3px solid #4a4a6a;
            border-radius: 0;
            max-width: none;
            margin: 0;
        }

        .canvas-container {
            flex: 1;
            background: #2a2a4a;
            padding: 4px;
            border-radius: 10px;
            box-shadow: inset 0 -4px 0 #4a4a6a, 0 0 0 3px #3a3a5a;
            position: relative;
            min-height: 0;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #6b8cff;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            border-radius: 6px;
            box-shadow: inset 0 0 0 2px #4a4a6a;
            cursor: pointer;
            touch-action: none;
            object-fit: contain;
        }

        .mobile-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: none;
            justify-content: space-between;
            padding: 0 10px;
            pointer-events: none;
            z-index: 10;
        }

        .mobile-btn {
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.9);
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transition: transform 0.05s;
            font-family: 'Courier New', monospace;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            min-width: 50px;
            min-height: 50px;
        }

        .mobile-btn:active {
            transform: scale(0.82);
        }

        .mobile-btn.jump-btn {
            background: rgba(62, 181, 240, 0.75);
            border-color: #3eb5f0;
            width: 70px;
            height: 70px;
            font-size: 30px;
        }

        .mobile-btn.dash-btn {
            background: rgba(240, 200, 62, 0.75);
            border-color: #f0c83e;
            width: 60px;
            height: 60px;
            font-size: 24px;
        }

        .mobile-btn.attack-btn {
            background: rgba(240, 80, 50, 0.75);
            border-color: #f05032;
            width: 60px;
            height: 60px;
            font-size: 24px;
            display: none;
        }

        .mobile-btn.fly-btn {
            background: rgba(100, 200, 255, 0.75);
            border-color: #64c8ff;
            width: 60px;
            height: 60px;
            font-size: 24px;
            display: none;
        }

        .mobile-btn.shoot-btn {
            background: rgba(50, 200, 80, 0.75);
            border-color: #32c850;
            width: 60px;
            height: 60px;
            font-size: 24px;
            display: none;
        }

        .mobile-btn-label {
            position: absolute;
            bottom: -24px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.8);
            font-size: 10px;
            white-space: nowrap;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            background: #2a2a4a;
            border-radius: 20px;
            border: 3px solid #4a4a6a;
            box-shadow: inset 0 3px 0 #3a3a5a, 0 4px 0 #1a1a2a;
            flex-wrap: wrap;
            gap: 3px;
            flex-shrink: 0;
        }

        .info {
            display: flex;
            gap: 4px;
            color: #e0e0ff;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #0a0a1a;
            letter-spacing: 0.5px;
            flex-wrap: wrap;
        }

        .info span {
            background: #1a1a3a;
            padding: 2px 6px;
            border-radius: 20px;
            border: 2px solid #3a3a5a;
            box-shadow: inset 0 -3px 0 #0a0a1a;
            font-size: 11px;
        }

        .rpg-panel {
            display: flex;
            gap: 4px;
            align-items: center;
            background: #1a1a3a;
            padding: 2px 8px;
            border-radius: 20px;
            border: 2px solid #3a3a5a;
            box-shadow: inset 0 -3px 0 #0a0a1a;
            flex-wrap: wrap;
        }

        .rpg-panel span {
            color: #e0e0ff;
            font-size: 10px;
            font-weight: bold;
            text-shadow: 1px 1px 0 #0a0a1a;
        }

        .skin-controls {
            display: flex;
            gap: 2px;
            align-items: center;
            background: #1a1a3a;
            padding: 2px 6px;
            border-radius: 20px;
            border: 2px solid #3a3a5a;
            box-shadow: inset 0 -3px 0 #0a0a1a;
            flex-wrap: wrap;
        }

        .skin-label {
            color: #8888aa;
            font-size: 10px;
            margin-right: 2px;
        }

        .skin-btn {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #555577;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 2px 0 #0a0a1a;
            touch-action: manipulation;
            flex-shrink: 0;
        }

        .skin-btn:active {
            transform: scale(0.85);
        }

        .skin-btn.active {
            border-color: #fff;
            box-shadow: 0 0 12px rgba(255,255,255,0.4);
            transform: scale(1.1);
        }

        .btn-group {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-wrap: wrap;
        }

        button {
            background: #6a5a3a;
            border: none;
            border-radius: 30px;
            padding: 4px 12px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            font-weight: bold;
            color: #f0e0c0;
            text-shadow: 1px 1px 0 #3a2a1a;
            border-bottom: 4px solid #4a3a2a;
            cursor: pointer;
            transition: 0.05s linear;
            box-shadow: 0 3px 0 #1a1a0a;
            letter-spacing: 0.5px;
            touch-action: manipulation;
        }

        button:active {
            transform: translateY(3px);
            border-bottom-width: 2px;
            box-shadow: 0 1px 0 #1a1a0a;
        }

        .keyboard-hint {
            color: #8888aa;
            font-size: 9px;
            background: #1a1a3a;
            padding: 2px 8px;
            border-radius: 12px;
            border: 1px solid #3a3a5a;
            display: none;
        }

        @media (pointer: coarse) {
            .mobile-controls {
                display: flex !important;
            }
            .mobile-btn.attack-btn {
                display: flex !important;
            }
            .mobile-btn.fly-btn {
                display: flex !important;
            }
            .mobile-btn.shoot-btn {
                display: flex !important;
            }
            .keyboard-hint {
                display: none !important;
            }
        }

        @media (pointer: fine) {
            .keyboard-hint {
                display: inline-block !important;
            }
            .mobile-controls {
                display: none !important;
            }
        }

        @media (max-width: 480px) {
            .game-wrapper {
                padding: 4px 4px 4px 4px;
                gap: 3px;
                border-width: 2px;
            }
            .canvas-container {
                padding: 3px;
                border-radius: 8px;
                box-shadow: inset 0 -3px 0 #4a4a6a, 0 0 0 2px #3a3a5a;
            }
            .panel {
                padding: 3px 6px;
                border-radius: 16px;
                border-width: 2px;
                gap: 2px;
            }
            .info {
                font-size: 10px;
                gap: 3px;
            }
            .info span {
                font-size: 9px;
                padding: 1px 5px;
                border-width: 2px;
            }
            .rpg-panel span {
                font-size: 9px;
            }
            .rpg-panel {
                padding: 2px 5px;
                gap: 3px;
            }
            .skin-btn {
                width: 15px;
                height: 15px;
                border-width: 2px;
            }
            .skin-controls {
                padding: 2px 4px;
                gap: 2px;
            }
            .skin-label {
                font-size: 8px;
            }
            button {
                font-size: 11px;
                padding: 3px 8px;
                border-bottom-width: 3px;
            }
            .mobile-btn.jump-btn {
                width: 58px;
                height: 58px;
                font-size: 24px;
                border-width: 3px;
            }
            .mobile-btn.dash-btn,
            .mobile-btn.attack-btn,
            .mobile-btn.fly-btn,
            .mobile-btn.shoot-btn {
                width: 46px;
                height: 46px;
                font-size: 18px;
                border-width: 3px;
            }
            .mobile-btn-label {
                font-size: 8px;
                bottom: -20px;
            }
            .mobile-controls {
                bottom: 6px;
                padding: 0 6px;
            }
            .fullscreen-btn {
                width: 32px;
                height: 32px;
                font-size: 16px;
                top: 6px;
                right: 6px;
                border-width: 2px;
            }
        }

        @media (max-width: 380px) {
            .mobile-btn.jump-btn {
                width: 48px;
                height: 48px;
                font-size: 20px;
            }
            .mobile-btn.dash-btn,
            .mobile-btn.attack-btn,
            .mobile-btn.fly-btn,
            .mobile-btn.shoot-btn {
                width: 38px;
                height: 38px;
                font-size: 14px;
            }
            .info span {
                font-size: 8px;
                padding: 1px 4px;
            }
            .rpg-panel span {
                font-size: 8px;
            }
            button {
                font-size: 10px;
                padding: 2px 6px;
            }
        }

        @media (min-aspect-ratio: 2/1) and (pointer: coarse) {
            .mobile-btn.jump-btn {
                width: 85px;
                height: 85px;
                font-size: 36px;
            }
            .mobile-btn.dash-btn,
            .mobile-btn.attack-btn,
            .mobile-btn.fly-btn,
            .mobile-btn.shoot-btn {
                width: 70px;
                height: 70px;
                font-size: 28px;
            }
        }

        @media (display-mode: fullscreen) {
            .fullscreen-btn {
                display: none !important;
            }
        }

        @media (max-width: 768px) {
            .fullscreen-btn {
                display: flex;
            }
        }

        @media (pointer: fine) {
            .fullscreen-btn {
                display: flex;
            }
        }
    </style>
</head>
<body>

<button class="fullscreen-btn" id="fullscreenBtn" title="Полный экран">⛶</button>

<div class="game-wrapper">
    <div class="canvas-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        
        <div class="mobile-controls" id="mobileControls">
            <button class="mobile-btn fly-btn" id="mobileFlyBtn">
                🦅
                <span class="mobile-btn-label">ПОЛЁТ</span>
            </button>
            <button class="mobile-btn shoot-btn" id="mobileShootBtn">
                🏹
                <span class="mobile-btn-label">СТРЕЛА</span>
            </button>
            <button class="mobile-btn dash-btn" id="mobileDashBtn">
                💨
                <span class="mobile-btn-label">РЫВОК</span>
            </button>
            <button class="mobile-btn attack-btn" id="mobileAttackBtn">
                ⚔️
                <span class="mobile-btn-label">АТАКА</span>
            </button>
            <button class="mobile-btn jump-btn" id="mobileJumpBtn">
                ⬆
                <span class="mobile-btn-label">ПРЫЖОК</span>
            </button>
        </div>
    </div>
    
    <div class="panel">
        <div class="info">
            <span>🏆 <span id="scoreDisplay">0</span></span>
            <span>⏺ <span id="platformCount">3</span></span>
            <span>🔄 <span id="jumpDisplay">2</span></span>
            <span>💨 <span id="dashDisplay">✓</span></span>
            <span>🐉 <span id="bossHpDisplay">❤️❤️❤️</span></span>
        </div>
        <div class="rpg-panel">
            <span>⭐ <span id="levelDisplay">1</span></span>
            <span>⚡ <span id="expDisplay">0</span></span>
            <span>❤️ <span id="hpDisplay">5</span></span>
            <span>⚔️ <span id="atkDisplay">2</span></span>
            <span>🦅 <span id="flyDisplay">✈️</span></span>
            <span>🏹 <span id="arrowDisplay">∞</span></span>
        </div>
        <div class="skin-controls">
            <span class="skin-label">🎨</span>
            <button class="skin-btn active" data-skin="blue" style="background:#3eb5f0;" title="Синий"></button>
            <button class="skin-btn" data-skin="red" style="background:#f03e3e;" title="Красный"></button>
            <button class="skin-btn" data-skin="green" style="background:#3ef03e;" title="Зелёный"></button>
            <button class="skin-btn" data-skin="yellow" style="background:#f0e83e;" title="Жёлтый"></button>
            <button class="skin-btn" data-skin="purple" style="background:#b83ef0;" title="Фиолетовый"></button>
            <button class="skin-btn" data-skin="orange" style="background:#f08a3e;" title="Оранжевый"></button>
            <button class="skin-btn" data-skin="pink" style="background:#f03e8a;" title="Розовый"></button>
            <button class="skin-btn" data-skin="cyan" style="background:#3ef0f0;" title="Голубой"></button>
        </div>
        <div class="btn-group">
            <button id="resetBtn">⟳ Рестарт</button>
            <span class="keyboard-hint">␣ полёт | F рывок | E атака | Q стрела</span>
        </div>
    </div>
</div>

<script>
    (function() {
        // --- Полноэкранный режим ---
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        fullscreenBtn.addEventListener('click', function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen?.() || 
                document.documentElement.webkitRequestFullscreen?.() ||
                document.documentElement.msRequestFullscreen?.();
            } else {
                document.exitFullscreen?.() || 
                document.webkitExitFullscreen?.() ||
                document.msExitFullscreen?.();
            }
        });

        document.addEventListener('fullscreenchange', () => {
            fullscreenBtn.style.display = document.fullscreenElement ? 'none' : 'flex';
        });
        document.addEventListener('webkitfullscreenchange', () => {
            fullscreenBtn.style.display = document.webkitFullscreenElement ? 'none' : 'flex';
        });

        // --- Основной код игры ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');
        const platformSpan = document.getElementById('platformCount');
        const jumpSpan = document.getElementById('jumpDisplay');
        const dashSpan = document.getElementById('dashDisplay');
        const bossHpSpan = document.getElementById('bossHpDisplay');
        const levelSpan = document.getElementById('levelDisplay');
        const expSpan = document.getElementById('expDisplay');
        const hpSpan = document.getElementById('hpDisplay');
        const atkSpan = document.getElementById('atkDisplay');
        const flySpan = document.getElementById('flyDisplay');
        const arrowSpan = document.getElementById('arrowDisplay');

        // --- Скины ---
        const SKINS = {
            blue: { body: '#3eb5f0', dark: '#1a4a6b', light: '#8ad4ff' },
            red: { body: '#f03e3e', dark: '#8a1a1a', light: '#ff6a6a' },
            green: { body: '#3ef03e', dark: '#1a8a1a', light: '#6aff6a' },
            yellow: { body: '#f0e83e', dark: '#8a840a', light: '#fff46a' },
            purple: { body: '#b83ef0', dark: '#6a1a8a', light: '#d46aff' },
            orange: { body: '#f08a3e', dark: '#8a4a1a', light: '#ffb46a' },
            pink: { body: '#f03e8a', dark: '#8a1a4a', light: '#ff6aaa' },
            cyan: { body: '#3ef0f0', dark: '#1a8a8a', light: '#6affff' }
        };

        let currentSkin = 'blue';

        // --- RPG Система ---
        let rpg = {
            level: 1,
            exp: 0,
            expToNext: 10,
            hp: 5,
            maxHp: 5,
            attack: 2,
            defense: 1
        };

        // --- Параметры игры ---
        const GRAVITY = 0.45;
        const JUMP_FORCE = -8.2;
        const DOUBLE_JUMP_FORCE = -7.2;
        const PLAYER_SIZE = 26;
        const GROUND_Y = 360;
        const SCROLL_SPEED = 2.5;
        const MAX_JUMPS = 2;
        const DASH_DISTANCE = 60;
        const DASH_COOLDOWN = 40;
        const FLY_SPEED = -3.5;
        const ARROW_SPEED = 8;
        const FLY_DURATION = 30; // 30 секунд

        // --- Босс ---
        let boss = {
            x: 0,
            y: 0,
            width: 80,
            height: 60,
            hp: 20,
            maxHp: 20,
            active: false,
            phase: 0,
            timer: 0,
            angle: 0,
            wingAngle: 0,
            fireballs: [],
            hitCooldown: 0,
            attackCooldown: 0
        };

        let bossSpawned = false;
        let bossDefeated = false;

        // --- Стрелы ---
        let arrows = [];

        function calculateMaxJumpDistance() {
            const jumpTime = 2 * Math.abs(JUMP_FORCE) / GRAVITY;
            const singleJumpDist = SCROLL_SPEED * jumpTime * 0.85;
            const doubleJumpDist = SCROLL_SPEED * (jumpTime + Math.abs(DOUBLE_JUMP_FORCE) / GRAVITY * 2) * 0.85;
            return {
                single: singleJumpDist,
                double: doubleJumpDist,
                safeSingle: singleJumpDist * 0.85,
                safeDouble: doubleJumpDist * 0.85
            };
        }

        const jumpDist = calculateMaxJumpDistance();

        // --- Состояние ---
        let player = {
            x: 130,
            y: GROUND_Y - PLAYER_SIZE,
            vy: 0,
            width: PLAYER_SIZE,
            height: PLAYER_SIZE,
            jumpsLeft: MAX_JUMPS,
            attackTimer: 0,
            invincible: 0,
            isFlying: false,
            isOnGround: false
        };

        // --- Таймер полёта (в секундах) ---
        let flyTimer = 0;
        const FLY_MAX_TIME = 30; // 30 секунд

        let platforms = [];
        let score = 0;
        let gameOver = false;
        let frameId = null;
        let platformCounter = 0;
        
        let dashCooldown = 0;
        let dashAvailable = true;
        let dashEffectTimer = 0;

        // --- FPS лимитер (автоматическая адаптация) ---
        let targetFPS = 120;
        let frameInterval = 1000 / targetFPS;
        let lastFrameTime = 0;
        let fpsCounter = 0;
        let fpsTimer = 0;
        let currentFPS = 0;

        // --- RPG функции ---
        function addExp(amount) {
            rpg.exp += amount;
            while (rpg.exp >= rpg.expToNext) {
                rpg.exp -= rpg.expToNext;
                rpg.level++;
                rpg.expToNext = Math.floor(rpg.expToNext * 1.5) + 5;
                rpg.maxHp += 2;
                rpg.hp = rpg.maxHp;
                rpg.attack += 1;
                rpg.defense += 0.5;
                updateRpgUI();
                ctx.fillStyle = 'rgba(255,215,0,0.5)';
                ctx.font = 'bold 40px "Courier New"';
                ctx.textAlign = 'center';
                ctx.fillText('⬆ УРОВЕНЬ ' + rpg.level + '!', canvas.width/2, 100);
                ctx.textAlign = 'left';
            }
            updateRpgUI();
        }

        function updateRpgUI() {
            levelSpan.textContent = rpg.level;
            expSpan.textContent = rpg.exp + '/' + rpg.expToNext;
            hpSpan.textContent = rpg.hp;
            atkSpan.textContent = rpg.attack;
            flySpan.textContent = player.isFlying ? '✈️' : '🦅';
            arrowSpan.textContent = '∞';
        }

        // --- Генерация платформ ---
        function generatePlatforms() {
            const newPlatforms = [];
            
            // Увеличенная стартовая платформа
            newPlatforms.push({
                x: 50,
                y: GROUND_Y - 8,
                width: 180, // было 100, теперь 180
                height: 12,
                color: '#6a9e6a',
                isStart: true
            });

            let lastX = 50 + 180; // обновляем позицию с учётом новой ширины
            const platformCount = 12 + Math.floor(Math.random() * 4);
            const minGap = 20;
            const maxGap = Math.floor(jumpDist.safeDouble * 0.7);
            
            for (let i = 0; i < platformCount; i++) {
                let gap = minGap + Math.random() * (maxGap * 0.6);
                
                if (Math.random() > 0.85 && i > 3) {
                    gap = maxGap * 0.5 + Math.random() * (maxGap * 0.3);
                }
                
                const x = lastX + gap;
                
                let y = GROUND_Y - 8;
                const heightRoll = Math.random();
                if (heightRoll < 0.2) {
                    y = GROUND_Y - 8 - 12;
                } else if (heightRoll < 0.5) {
                    y = GROUND_Y - 8 - 4;
                } else if (heightRoll < 0.8) {
                    y = GROUND_Y - 8 + 4;
                } else {
                    y = GROUND_Y - 8 + 12;
                }
                y = Math.min(Math.max(y, GROUND_Y - 40), GROUND_Y + 18);
                
                let width = 45 + Math.floor(Math.random() * 25);
                
                if (Math.random() > 0.9 && i > 4) {
                    width = 30 + Math.floor(Math.random() * 10);
                }
                
                const heightDiff = Math.abs(y - (GROUND_Y - 8));
                let adjustedGap = gap;
                if (heightDiff > 15) {
                    adjustedGap = gap * 0.85;
                }
                
                const isTrap = Math.random() > 0.95 && i > 4;
                
                newPlatforms.push({
                    x: x,
                    y: y,
                    width: isTrap ? 25 + Math.floor(Math.random() * 10) : width,
                    height: 12,
                    color: isTrap ? '#8b3a3a' : `hsl(${40 + Math.floor(Math.random() * 30)}, 50%, 42%)`,
                    isTrap: isTrap,
                    gap: adjustedGap
                });
                lastX = x + width;
            }

            newPlatforms.push({
                x: lastX + 80,
                y: GROUND_Y - 8,
                width: 250,
                height: 16,
                color: '#4a2a6a',
                isBossArena: true
            });

            return newPlatforms;
        }

        function placePlayerOnStartPlatform() {
            const startPlat = platforms.find(p => p.isStart === true);
            if (startPlat) {
                player.x = startPlat.x + 30; // немного смещаем вправо для удобства
                player.y = startPlat.y - PLAYER_SIZE + 1;
                player.vy = 0;
                player.jumpsLeft = MAX_JUMPS;
                player.isFlying = false;
            } else {
                player.x = 130;
                player.y = GROUND_Y - PLAYER_SIZE;
                player.vy = 0;
                player.jumpsLeft = MAX_JUMPS;
                player.isFlying = false;
            }
            updateJumpUI();
        }

        function initGame() {
            platforms = generatePlatforms();
            placePlayerOnStartPlatform();
            score = 0;
            gameOver = false;
            platformCounter = 0;
            dashCooldown = 0;
            dashAvailable = true;
            dashEffectTimer = 0;
            bossSpawned = false;
            bossDefeated = false;
            boss.active = false;
            boss.fireballs = [];
            boss.hitCooldown = 0;
            boss.attackCooldown = 0;
            arrows = [];
            player.attackTimer = 0;
            player.invincible = 0;
            player.isFlying = false;
            flyTimer = 0;
            
            rpg.level = 1;
            rpg.exp = 0;
            rpg.expToNext = 10;
            rpg.hp = 5;
            rpg.maxHp = 5;
            rpg.attack = 2;
            rpg.defense = 1;
            
            updateUI();
            updateBossHp();
            updateRpgUI();
        }

        function updateUI() {
            scoreSpan.textContent = Math.floor(score);
            platformSpan.textContent = platforms.length;
            updateJumpUI();
            updateDashUI();
        }

        function updateJumpUI() {
            jumpSpan.textContent = player.jumpsLeft;
        }

        function updateDashUI() {
            dashSpan.textContent = dashAvailable ? '✓' : '⏳';
            dashSpan.style.color = dashAvailable ? '#7cfc7c' : '#ff6666';
        }

        function updateBossHp() {
            if (bossDefeated) {
                bossHpSpan.textContent = '💀';
                return;
            }
            if (!boss.active) {
                bossHpSpan.textContent = '🐉❓';
                return;
            }
            const hearts = Math.ceil(boss.hp / boss.maxHp * 5);
            bossHpSpan.textContent = '❤️'.repeat(Math.max(0, hearts)) + '🖤'.repeat(Math.max(0, 5 - hearts));
        }

        // --- Стрельба из лука ---
        function shootArrow() {
            if (gameOver) return;
            if (!boss.active || bossDefeated) return;
            
            const dx = boss.x - player.x;
            const dy = boss.y - player.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist === 0) return;
            
            const speed = ARROW_SPEED;
            arrows.push({
                x: player.x + player.width / 2,
                y: player.y + player.height / 2,
                vx: (dx / dist) * speed,
                vy: (dy / dist) * speed,
                damage: Math.floor(rpg.attack + Math.random() * 1.5)
            });
            
            ctx.fillStyle = 'rgba(255,200,100,0.3)';
            ctx.beginPath();
            ctx.arc(player.x + player.width/2, player.y + player.height/2, 20, 0, Math.PI * 2);
            ctx.fill();
        }

        // --- Атака мечом ---
        function playerAttack() {
            if (gameOver) return;
            if (player.attackTimer > 0) return;
            if (!boss.active || bossDefeated) return;
            
            player.attackTimer = 15;
            
            const dist = Math.abs(player.x - boss.x);
            const distY = Math.abs(player.y - boss.y);
            if (dist < 130 && distY < 80) {
                const damage = Math.floor(rpg.attack + Math.random() * 2 + (player.isFlying ? 3 : 0));
                boss.hp -= damage;
                boss.hitCooldown = 15;
                updateBossHp();
                
                ctx.fillStyle = 'rgba(255,200,50,0.6)';
                ctx.font = 'bold 28px "Courier New"';
                ctx.fillText('-' + damage + ' HP!', boss.x + 20, boss.y - 20);
                
                addExp(2);
                
                if (boss.hp <= 0) {
                    bossDefeated = true;
                    boss.active = false;
                    bossHpSpan.textContent = '💀';
                    score += 100;
                    addExp(50);
                    updateUI();
                }
            } else {
                ctx.fillStyle = 'rgba(255,100,100,0.5)';
                ctx.font = '20px "Courier New"';
                ctx.fillText('✗ МИМО!', player.x - 20, player.y - 30);
            }
        }

        // --- Полёт с таймером (в секундах) ---
        function toggleFly() {
            if (gameOver) return;
            
            if (player.isFlying) {
                player.isFlying = false;
                flyTimer = 0;
                updateRpgUI();
                return;
            }
            
            if (flyTimer < FLY_MAX_TIME) {
                player.isFlying = true;
                if (player.vy > 0) {
                    player.vy = 0;
                }
                updateRpgUI();
            } else {
                ctx.fillStyle = 'rgba(255,50,50,0.7)';
                ctx.font = '24px "Courier New"';
                ctx.textAlign = 'center';
                ctx.fillText('🕒 Полёт закончился!', canvas.width/2, 80);
                ctx.textAlign = 'left';
            }
        }

        // --- Обновление (с использованием deltaTime) ---
        function updateGame(deltaTime) {
            if (gameOver) return;

            // Обновление таймера полёта (в секундах)
            if (player.isFlying) {
                flyTimer += deltaTime;
                if (flyTimer >= FLY_MAX_TIME) {
                    player.isFlying = false;
                    flyTimer = 0;
                    updateRpgUI();
                    ctx.fillStyle = 'rgba(255,200,50,0.8)';
                    ctx.font = 'bold 28px "Courier New"';
                    ctx.textAlign = 'center';
                    ctx.fillText('⏳ Полёт окончен!', canvas.width/2, 70);
                    ctx.textAlign = 'left';
                }
            }

            if (player.attackTimer > 0) player.attackTimer--;
            if (player.invincible > 0) player.invincible--;

            if (!dashAvailable) {
                dashCooldown--;
                if (dashCooldown <= 0) {
                    dashAvailable = true;
                    updateDashUI();
                }
            }
            
            if (dashEffectTimer > 0) {
                dashEffectTimer--;
            }

            // Движение платформ
            for (let p of platforms) {
                p.x -= SCROLL_SPEED;
            }

            // Движение стрел
            for (let i = arrows.length - 1; i >= 0; i--) {
                const a = arrows[i];
                a.x += a.vx;
                a.y += a.vy;
                
                if (boss.active && !bossDefeated &&
                    a.x > boss.x && a.x < boss.x + boss.width &&
                    a.y > boss.y && a.y < boss.y + boss.height) {
                    boss.hp -= a.damage;
                    boss.hitCooldown = 10;
                    arrows.splice(i, 1);
                    updateBossHp();
                    addExp(1);
                    
                    ctx.fillStyle = 'rgba(100,255,100,0.6)';
                    ctx.font = 'bold 24px "Courier New"';
                    ctx.fillText('🏹 -' + a.damage + ' HP!', boss.x + 20, boss.y - 40);
                    
                    if (boss.hp <= 0) {
                        bossDefeated = true;
                        boss.active = false;
                        bossHpSpan.textContent = '💀';
                        score += 100;
                        addExp(50);
                        updateUI();
                    }
                    continue;
                }
                
                if (a.x < -20 || a.x > canvas.width + 20 || 
                    a.y < -20 || a.y > canvas.height + 20) {
                    arrows.splice(i, 1);
                }
            }

            // Физика игрока
            if (player.isFlying) {
                player.vy = FLY_SPEED;
            } else {
                player.vy += GRAVITY;
            }
            player.y += player.vy;

            let onGround = false;
            let landedOnBossArena = false;

            for (let i = 0; i < platforms.length; i++) {
                const p = platforms[i];
                if (!player.isFlying && player.vy >= 0 &&
                    player.x + player.width > p.x + 4 &&
                    player.x < p.x + p.width - 4 &&
                    player.y + player.height >= p.y &&
                    player.y + player.height <= p.y + p.height + 6) {
                    player.y = p.y - player.height;
                    player.vy = 0;
                    onGround = true;
                    
                    player.jumpsLeft = MAX_JUMPS;
                    updateJumpUI();
                    
                    if (p.isBossArena) {
                        landedOnBossArena = true;
                        if (!bossSpawned && !bossDefeated) {
                            spawnBoss();
                        }
                    }
                    break;
                }
            }

            if (!onGround && !player.isFlying) {
                for (let i = 0; i < platforms.length; i++) {
                    const p = platforms[i];
                    if (player.vy < 0 &&
                        player.x + player.width > p.x + 4 &&
                        player.x < p.x + p.width - 4 &&
                        player.y <= p.y + p.height &&
                        player.y + player.height >= p.y) {
                        player.y = p.y + p.height;
                        player.vy = 0.5;
                        break;
                    }
                }
            }

            player.isOnGround = onGround;

            // --- Логика босса ---
            if (boss.active && !bossDefeated) {
                updateBoss();
                
                if (boss.attackCooldown <= 0) {
                    if (Math.abs(player.x - boss.x) < 80 && Math.abs(player.y - boss.y) < 50) {
                        if (player.invincible <= 0 && !player.isFlying) {
                            const damage = Math.max(1, 3 - Math.floor(rpg.defense));
                            rpg.hp -= damage;
                            player.invincible = 30;
                            updateRpgUI();
                            
                            if (rpg.hp <= 0) {
                                gameOver = true;
                                return;
                            }
                        }
                        boss.attackCooldown = 30;
                    }
                }
                if (boss.attackCooldown > 0) boss.attackCooldown--;

                if (!player.isFlying && player.invincible <= 0 &&
                    player.x + player.width > boss.x + 10 &&
                    player.x < boss.x + boss.width - 10 &&
                    player.y + player.height > boss.y + 10 &&
                    player.y < boss.y + boss.height - 10) {
                    const damage = Math.max(1, 3 - Math.floor(rpg.defense));
                    rpg.hp -= damage;
                    player.invincible = 30;
                    updateRpgUI();
                    
                    if (rpg.hp <= 0) {
                        gameOver = true;
                        return;
                    }
                }

                if (!player.isFlying && player.vy > 0 &&
                    player.x + player.width > boss.x + 10 &&
                    player.x < boss.x + boss.width - 10 &&
                    player.y + player.height >= boss.y &&
                    player.y + player.height <= boss.y + 15 &&
                    boss.hitCooldown <= 0) {
                    const damage = Math.floor(rpg.attack * 1.5 + Math.random());
                    boss.hp -= damage;
                    boss.hitCooldown = 25;
                    player.vy = -7;
                    updateBossHp();
                    addExp(3);
                    
                    if (boss.hp <= 0) {
                        bossDefeated = true;
                        boss.active = false;
                        bossHpSpan.textContent = '💀';
                        score += 100;
                        addExp(50);
                        updateUI();
                    }
                }

                if (boss.hitCooldown > 0) {
                    boss.hitCooldown--;
                }

                for (let i = boss.fireballs.length - 1; i >= 0; i--) {
                    const fb = boss.fireballs[i];
                    fb.x -= fb.speed;
                    fb.y += fb.vy;
                    fb.vy += 0.1;
                    
                    if (player.invincible <= 0 &&
                        player.x + player.width > fb.x - 8 &&
                        player.x < fb.x + 8 &&
                        player.y + player.height > fb.y - 8 &&
                        player.y < fb.y + 8) {
                        const damage = player.isFlying ? Math.max(0, 1 - Math.floor(rpg.defense)) : Math.max(1, 2 - Math.floor(rpg.defense));
                        if (damage > 0) {
                            rpg.hp -= damage;
                            player.invincible = 30;
                            updateRpgUI();
                            boss.fireballs.splice(i, 1);
                            
                            if (rpg.hp <= 0) {
                                gameOver = true;
                                return;
                            }
                        } else {
                            boss.fireballs.splice(i, 1);
                        }
                        continue;
                    }
                    
                    if (fb.x < -20 || fb.y > canvas.height + 20) {
                        boss.fireballs.splice(i, 1);
                    }
                }
            }

            if (player.y > canvas.height + 30) {
                gameOver = true;
                return;
            }

            if (player.y < -50) {
                player.y = -50;
                player.vy = 0.5;
            }

            platforms = platforms.filter(p => p.x + p.width > -30 || p.isBossArena);

            const lastPlatform = platforms[platforms.length - 1];
            if (lastPlatform && lastPlatform.x < 700 && !lastPlatform.isBossArena) {
                const minGap = 20;
                const maxGap = Math.floor(jumpDist.safeDouble * 0.7);
                
                let gap = minGap + Math.random() * (maxGap * 0.6);
                
                if (Math.random() > 0.9 && platformCounter > 5) {
                    gap = maxGap * 0.5 + Math.random() * (maxGap * 0.3);
                }
                
                let y = GROUND_Y - 8;
                const heightRoll = Math.random();
                if (heightRoll < 0.2) {
                    y = GROUND_Y - 8 - 12;
                } else if (heightRoll < 0.5) {
                    y = GROUND_Y - 8 - 4;
                } else if (heightRoll < 0.8) {
                    y = GROUND_Y - 8 + 4;
                } else {
                    y = GROUND_Y - 8 + 12;
                }
                y = Math.min(Math.max(y, GROUND_Y - 40), GROUND_Y + 18);
                
                const heightDiff = Math.abs(y - (GROUND_Y - 8));
                if (heightDiff > 15) {
                    gap = gap * 0.85;
                }
                
                const newX = lastPlatform.x + lastPlatform.width + gap;
                
                let width = 45 + Math.floor(Math.random() * 25);
                if (Math.random() > 0.9 && platformCounter > 4) {
                    width = 30 + Math.floor(Math.random() * 10);
                }
                
                const isTrap = Math.random() > 0.95 && platformCounter > 5;
                
                const newPlat = {
                    x: newX,
                    y: y,
                    width: isTrap ? 25 + Math.floor(Math.random() * 10) : width,
                    height: 12,
                    color: isTrap ? '#8b3a3a' : `hsl(${35 + Math.floor(Math.random() * 35)}, 45%, 42%)`,
                    isTrap: isTrap
                };
                platforms.push(newPlat);
                platformCounter++;
                updateUI();
            }

            if (player.x < 0) {
                player.x = 0;
            }
            
            if (player.x + player.width > canvas.width) {
                player.x = canvas.width - player.width;
            }
        }

        // --- Создание босса ---
        function spawnBoss() {
            boss.active = true;
            bossSpawned = true;
            boss.x = canvas.width - 120;
            boss.y = 60;
            boss.hp = boss.maxHp + Math.floor(rpg.level * 2);
            boss.maxHp = boss.hp;
            boss.phase = 0;
            boss.timer = 0;
            boss.fireballs = [];
            boss.hitCooldown = 0;
            boss.attackCooldown = 0;
            updateBossHp();
        }

        // --- Обновление босса ---
        function updateBoss() {
            boss.timer++;
            boss.angle += 0.03;
            boss.wingAngle = Math.sin(boss.timer * 0.05) * 0.3;

            if (boss.phase === 0) {
                boss.y = 60 + Math.sin(boss.timer * 0.02) * 30;
                boss.x = canvas.width - 120 - Math.sin(boss.timer * 0.015) * 50;
                
                if (boss.timer % 100 < 10 && boss.timer > 30) {
                    boss.phase = 1;
                    boss.timer = 0;
                }
            } else if (boss.phase === 1) {
                boss.x -= 1.5;
                boss.y += 1.2;
                
                if (boss.timer % 12 === 0 && boss.timer < 50) {
                    boss.fireballs.push({
                        x: boss.x - 10,
                        y: boss.y + boss.height / 2,
                        speed: 2 + Math.random() * 1.5,
                        vy: -0.5 + Math.random() * 1
                    });
                }
                
                if (boss.timer > 70) {
                    boss.phase = 0;
                    boss.timer = 0;
                    boss.y = 60;
                }
            }

            if (boss.x < 100) boss.x = 100;
            if (boss.x > canvas.width - 120) boss.x = canvas.width - 120;
            if (boss.y < 30) boss.y = 30;
            if (boss.y > GROUND_Y - 80) boss.y = GROUND_Y - 80;
        }

        // --- Рисование босса ---
        function drawBoss() {
            if (!boss.active || bossDefeated) return;

            const bx = boss.x, by = boss.y;
            const wing = boss.wingAngle;

            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(bx + 40, GROUND_Y - 4, 50, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#2a1a3a';
            ctx.fillRect(bx + 10, by + 10, 60, 40);
            
            ctx.fillStyle = '#3a2a4a';
            ctx.fillRect(bx, by, 30, 30);
            ctx.fillRect(bx + 25, by + 5, 15, 20);

            ctx.fillStyle = '#ff4444';
            ctx.fillRect(bx + 5, by + 8, 8, 6);
            ctx.fillRect(bx + 18, by + 8, 8, 6);
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(bx + 7, by + 10, 4, 3);
            ctx.fillRect(bx + 20, by + 10, 4, 3);

            ctx.fillStyle = '#1a0a2a';
            ctx.fillRect(bx + 8, by + 22, 14, 4);

            ctx.fillStyle = '#3a2a5a';
            ctx.fillRect(bx - 10 + Math.sin(wing) * 5, by + 5, 12, 30);
            ctx.fillRect(bx - 20 + Math.sin(wing) * 8, by + 10, 10, 20);
            ctx.fillRect(bx - 30 + Math.sin(wing) * 10, by + 15, 10, 15);
            
            ctx.fillRect(bx + 70 - Math.sin(wing) * 5, by + 5, 12, 30);
            ctx.fillRect(bx + 80 - Math.sin(wing) * 8, by + 10, 10, 20);
            ctx.fillRect(bx + 90 - Math.sin(wing) * 10, by + 15, 10, 15);

            ctx.fillStyle = '#2a1a3a';
            ctx.fillRect(bx + 55, by + 35, 20, 6);
            ctx.fillRect(bx + 70, by + 38, 15, 4);

            ctx.fillStyle = '#4a2a5a';
            for (let i = 0; i < 5; i++) {
                ctx.fillRect(bx + 15 + i * 12, by - 2 - Math.sin(i) * 3, 4, 8);
            }

            const hpPercent = boss.hp / boss.maxHp;
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(bx, by - 18, boss.width, 8);
            ctx.fillStyle = hpPercent > 0.5 ? '#4f4' : '#f44';
            ctx.fillRect(bx + 2, by - 16, (boss.width - 4) * hpPercent, 4);
            
            ctx.fillStyle = '#fff';
            ctx.font = '10px "Courier New"';
            ctx.fillText('🐉 ЭНДЕР ДРАКОН', bx + 5, by - 22);
            
            ctx.fillStyle = '#ffaa00';
            ctx.font = '9px "Courier New"';
            ctx.fillText('Lv.' + Math.floor(rpg.level * 1.5), bx + boss.width - 30, by - 22);

            for (let fb of boss.fireballs) {
                ctx.fillStyle = '#ff8800';
                ctx.beginPath();
                ctx.arc(fb.x, fb.y, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffcc00';
                ctx.beginPath();
                ctx.arc(fb.x - 2, fb.y - 2, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(fb.x - 3, fb.y - 4, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // --- Рывок ---
        function dash() {
            if (gameOver) return;
            if (!dashAvailable) return;
            
            const oldX = player.x;
            player.x += DASH_DISTANCE;
            
            for (let p of platforms) {
                if (player.x + player.width > p.x + 2 && 
                    player.x < p.x + p.width - 2) {
                    if (player.y + player.height > p.y && 
                        player.y < p.y + p.height) {
                        if (player.vy >= 0) {
                            player.y = p.y - player.height;
                            player.vy = 0;
                            player.jumpsLeft = MAX_JUMPS;
                            updateJumpUI();
                        } else {
                            player.y = p.y + p.height;
                            player.vy = 0.5;
                        }
                        break;
                    }
                }
            }
            
            if (player.x + player.width > canvas.width) {
                player.x = canvas.width - player.width;
            }
            
            dashAvailable = false;
            dashCooldown = DASH_COOLDOWN;
            dashEffectTimer = 15;
            updateDashUI();
            
            ctx.fillStyle = 'rgba(100, 200, 255, 0.4)';
            ctx.beginPath();
            ctx.arc(oldX + DASH_DISTANCE/2, player.y + player.height/2, 30, 0, Math.PI * 2);
            ctx.fill();
        }

        // --- Отрисовка игрока ---
        function drawPlayer(px, py, size, skinName) {
            const skin = SKINS[skinName] || SKINS.blue;
            
            if (player.invincible > 0 && player.invincible % 6 < 3) {
                ctx.globalAlpha = 0.5;
            }
            
            if (player.isFlying) {
                ctx.fillStyle = 'rgba(200,230,255,0.4)';
                ctx.fillRect(px - 12, py - 5, 10, size + 10);
                ctx.fillRect(px + size + 2, py - 5, 10, size + 10);
                ctx.fillStyle = 'rgba(200,230,255,0.6)';
                ctx.fillRect(px - 10, py, 8, size);
                ctx.fillRect(px + size + 2, py, 8, size);
            }
            
            ctx.fillStyle = skin.body;
            ctx.fillRect(px, py, size, size);
            
            ctx.strokeStyle = skin.dark;
            ctx.lineWidth = 3;
            ctx.strokeRect(px, py, size, size);
            
            ctx.fillStyle = '#f5f5f5';
            ctx.fillRect(px + 4, py + 4, 6, 6);
            ctx.fillRect(px + 14, py + 4, 6, 6);
            
            ctx.fillStyle = '#222';
            ctx.fillRect(px + 6, py + 6, 3, 3);
            ctx.fillRect(px + 16, py + 6, 3, 3);
            
            ctx.fillStyle = '#222';
            ctx.fillRect(px + 8, py + 14, 8, 3);
            
            ctx.fillStyle = skin.light;
            ctx.fillRect(px, py, size, 4);
            ctx.fillRect(px, py+4, 3, 4);
            ctx.fillRect(px+size-3, py+4, 3, 4);
            
            ctx.globalAlpha = 1;
            
            if (player.attackTimer > 0) {
                ctx.fillStyle = 'rgba(255,200,50,0.3)';
                ctx.fillRect(px + size + 5, py - 5, 20, size + 10);
                ctx.fillStyle = 'rgba(255,200,50,0.5)';
                ctx.fillRect(px + size + 10, py, 10, size);
            }

            if (boss.active && !bossDefeated) {
                ctx.fillStyle = '#8B6914';
                ctx.fillRect(px + size + 2, py + 4, 4, 18);
                ctx.fillStyle = '#D4A017';
                ctx.fillRect(px + size + 1, py + 3, 6, 4);
                ctx.fillRect(px + size + 1, py + 19, 6, 4);
                ctx.strokeStyle = '#F5DEB3';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(px + size + 4, py + 4);
                ctx.lineTo(px + size + 10, py + 11);
                ctx.lineTo(px + size + 4, py + 20);
                ctx.stroke();
            }
        }

        // --- Отрисовка ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            if (boss.active && !bossDefeated) {
                gradient.addColorStop(0, '#1a0a2a');
                gradient.addColorStop(0.5, '#2a1a3a');
                gradient.addColorStop(1, '#3a2a4a');
            } else {
                gradient.addColorStop(0, '#4a8cff');
                gradient.addColorStop(0.65, '#7fc0ff');
                gradient.addColorStop(1, '#b3d9ff');
            }
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (!boss.active || bossDefeated) {
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                const time = performance.now() / 3000;
                for (let i = 0; i < 6; i++) {
                    const cx = ((i * 160 + time * 40) % 1000) - 100;
                    const cy = 30 + (i * 23) % 70;
                    ctx.fillRect(cx, cy, 60, 20);
                    ctx.fillRect(cx + 20, cy - 12, 30, 16);
                    ctx.fillRect(cx + 10, cy + 10, 40, 12);
                }
            }

            for (let p of platforms) {
                if (p.isStart) {
                    ctx.fillStyle = '#6a9e6a';
                } else if (p.isBossArena) {
                    ctx.fillStyle = '#4a2a6a';
                } else if (p.isTrap) {
                    ctx.fillStyle = '#8b3a3a';
                } else {
                    ctx.fillStyle = p.color || '#8b7a5a';
                }
                ctx.fillRect(p.x, p.y, p.width, p.height);
                
                ctx.fillStyle = 'rgba(0,0,0,0.25)';
                for (let i = 0; i < p.width; i += 8) {
                    ctx.fillRect(p.x + i, p.y, 2, p.height);
                }
                ctx.fillStyle = 'rgba(255,255,200,0.3)';
                ctx.fillRect(p.x, p.y, p.width, 3);
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(p.x, p.y + p.height - 3, p.width, 3);

                if (p.isStart) {
                    ctx.fillStyle = '#7cfc7c';
                    ctx.font = '18px "Courier New"';
                    ctx.fillText('▶ СТАРТ', p.x + 6, p.y - 10);
                }

                if (p.isBossArena) {
                    ctx.fillStyle = '#aa88ff';
                    ctx.font = '20px "Courier New"';
                    ctx.fillText('⚔️ БОСС', p.x + 80, p.y - 15);
                }

                if (p.isTrap) {
                    ctx.fillStyle = '#ff4444';
                    ctx.font = '16px "Courier New"';
                    ctx.fillText('⚠', p.x + p.width/2 - 8, p.y - 8);
                }
            }

            drawBoss();

            for (let a of arrows) {
                ctx.fillStyle = '#8B6914';
                ctx.save();
                ctx.translate(a.x, a.y);
                ctx.rotate(Math.atan2(a.vy, a.vx));
                ctx.fillRect(-10, -2, 16, 4);
                ctx.fillStyle = '#D4A017';
                ctx.fillRect(-10, -3, 4, 6);
                ctx.fillStyle = '#F5DEB3';
                ctx.fillRect(-14, -1, 4, 2);
                ctx.restore();
            }

            if (dashEffectTimer > 0) {
                const alpha = dashEffectTimer / 20;
                ctx.fillStyle = `rgba(100, 200, 255, ${alpha * 0.6})`;
                ctx.fillRect(player.x - DASH_DISTANCE + 10, player.y, player.width, player.height);
                ctx.fillStyle = `rgba(100, 200, 255, ${alpha * 0.3})`;
                ctx.fillRect(player.x - DASH_DISTANCE + 5, player.y + 4, player.width - 10, player.height - 8);
            }

            const px = player.x, py = player.y, size = player.width;
            
            if (dashAvailable) {
                ctx.shadowColor = '#7cfc7c';
                ctx.shadowBlur = 8;
            } else {
                ctx.shadowColor = '#ff6666';
                ctx.shadowBlur = 5;
            }
            
            drawPlayer(px, py, size, currentSkin);
            ctx.shadowBlur = 0;

            if (player.jumpsLeft > 0 && !gameOver && !player.isFlying) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(px + 4, py - 22, 18, 16);
                ctx.fillStyle = '#fff';
                ctx.font = '14px "Courier New"';
                ctx.fillText('×' + player.jumpsLeft, px + 7, py - 10);
            }

            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(px + size - 24, py - 22, 20, 16);
            ctx.fillStyle = dashAvailable ? '#7cfc7c' : '#ff6666';
            ctx.font = '12px "Courier New"';
            ctx.fillText('F', px + size - 18, py - 10);

            if (boss.active && !bossDefeated) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(px + size + 2, py - 22, 20, 16);
                ctx.fillStyle = player.attackTimer > 0 ? '#ffaa00' : '#ffcc66';
                ctx.font = '12px "Courier New"';
                ctx.fillText('E', px + size + 8, py - 10);
                
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(px + size + 26, py - 22, 20, 16);
                ctx.fillStyle = '#32c850';
                ctx.font = '12px "Courier New"';
                ctx.fillText('Q', px + size + 32, py - 10);
            }

            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.fillRect(10, 10, 200, 40);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 22px "Courier New"';
            ctx.fillText('SCORE: ' + Math.floor(score), 20, 42);

            if (boss.active && !bossDefeated) {
                ctx.fillStyle = 'rgba(255,200,50,0.9)';
                ctx.font = '18px "Courier New"';
                ctx.textAlign = 'center';
                ctx.fillText('🏹 Q - СТРЕЛА  |  ⚔️ E - АТАКА  |  🦅 Пробел - ПОЛЁТ', canvas.width/2, 25);
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.font = '14px "Courier New"';
                ctx.fillText('Уклоняйся от файерболов!', canvas.width/2, 50);
                ctx.textAlign = 'left';
            }

            if (bossDefeated) {
                ctx.fillStyle = 'rgba(255,215,0,0.9)';
                ctx.font = 'bold 36px "Courier New"';
                ctx.textAlign = 'center';
                ctx.fillText('🏆 ДРАКОН ПОВЕРЖЕН!', canvas.width/2, 120);
                ctx.textAlign = 'left';
            }

            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#f0f0f0';
                ctx.font = 'bold 44px "Courier New"';
                ctx.textAlign = 'center';

                let isWin = bossDefeated;
                ctx.fillText(isWin ? '🎉 ПОБЕДА!' : '💀 GAME OVER', canvas.width/2, 180);
                ctx.font = '24px "Courier New"';
                ctx.fillText('Нажми "Рестарт"', canvas.width/2, 260);
                ctx.textAlign = 'left';
            }
            
            if (player.isFlying) {
                const remaining = Math.max(0, Math.ceil(FLY_MAX_TIME - flyTimer));
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(canvas.width - 120, 10, 110, 28);
                ctx.fillStyle = remaining > 10 ? '#7cfc7c' : '#ff6666';
                ctx.font = 'bold 18px "Courier New"';
                ctx.textAlign = 'right';
                ctx.fillText('🕒 ' + remaining + 'с', canvas.width - 15, 32);
                ctx.textAlign = 'left';
            }

            // Отображение FPS
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(canvas.width - 70, 40, 65, 22);
            ctx.fillStyle = currentFPS >= 60 ? '#7cfc7c' : '#ffaa00';
            ctx.font = '12px "Courier New"';
            ctx.textAlign = 'right';
            ctx.fillText('FPS: ' + Math.round(currentFPS), canvas.width - 10, 57);
            ctx.textAlign = 'left';
        }

        // --- Цикл с автоматической адаптацией FPS ---
        function gameLoop(timestamp) {
            // Пропускаем кадры, если прошло недостаточно времени
            if (timestamp - lastFrameTime < frameInterval) {
                frameId = requestAnimationFrame(gameLoop);
                return;
            }
            
            // Вычисляем deltaTime в секундах
            const deltaTime = Math.min((timestamp - lastFrameTime) / 1000, 0.05);
            lastFrameTime = timestamp;
            
            // Обновляем счётчик FPS
            fpsCounter++;
            if (timestamp - fpsTimer >= 1000) {
                currentFPS = fpsCounter;
                fpsCounter = 0;
                fpsTimer = timestamp;
            }
            
            if (!gameOver) {
                updateGame(deltaTime);
            }
            draw();
            frameId = requestAnimationFrame(gameLoop);
        }

        // --- Прыжок ---
        function jump() {
            if (gameOver) return;
            
            if (boss.active && !bossDefeated) {
                toggleFly();
                return;
            }
            
            if (player.jumpsLeft > 0 && !player.isFlying) {
                const jumpForce = (player.jumpsLeft === MAX_JUMPS) ? JUMP_FORCE : DOUBLE_JUMP_FORCE;
                
                let onGround = false;
                if (player.jumpsLeft === MAX_JUMPS) {
                    for (let p of platforms) {
                        if (player.x + player.width > p.x + 4 &&
                            player.x < p.x + p.width - 4 &&
                            Math.abs(player.y + player.height - p.y) < 8) {
                            onGround = true;
                            break;
                        }
                    }
                    if (onGround) {
                        player.vy = jumpForce;
                        player.jumpsLeft--;
                        updateJumpUI();
                        return;
                    }
                }
                
                if (player.jumpsLeft < MAX_JUMPS) {
                    player.vy = jumpForce;
                    player.jumpsLeft--;
                    updateJumpUI();
                    
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.beginPath();
                    ctx.arc(player.x + player.width/2, player.y + player.height/2, 20, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        // --- Смена скина ---
        function setSkin(skinName) {
            if (SKINS[skinName]) {
                currentSkin = skinName;
                document.querySelectorAll('.skin-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.skin === skinName);
                });
            }
        }

        // --- Обработчики клавиатуры ---
        function handleKey(e) {
            if (e.code === 'Space') {
                e.preventDefault();
                if (boss.active && !bossDefeated) {
                    toggleFly();
                } else {
                    jump();
                }
            }
            if (e.key === 'f' || e.key === 'F') {
                e.preventDefault();
                dash();
            }
            if (e.key === 'e' || e.key === 'E') {
                e.preventDefault();
                playerAttack();
            }
            if (e.key === 'q' || e.key === 'Q') {
                e.preventDefault();
                shootArrow();
            }
        }

        // --- Обработчики кликов ---
        function handleClick(e) {
            e.preventDefault();
            if (boss.active && !bossDefeated) {
                toggleFly();
            } else {
                jump();
            }
        }

        // --- Рестарт ---
        function resetGame() {
            if (frameId) cancelAnimationFrame(frameId);
            lastFrameTime = 0;
            fpsCounter = 0;
            fpsTimer = 0;
            currentFPS = 0;
            initGame();
            frameId = requestAnimationFrame(gameLoop);
        }

        // --- Мобильные кнопки ---
        const mobileJumpBtn = document.getElementById('mobileJumpBtn');
        const mobileDashBtn = document.getElementById('mobileDashBtn');
        const mobileAttackBtn = document.getElementById('mobileAttackBtn');
        const mobileFlyBtn = document.getElementById('mobileFlyBtn');
        const mobileShootBtn = document.getElementById('mobileShootBtn');

        function setupMobileButton(btn, action) {
            if (!btn) return;
            btn.addEventListener('touchstart', function(e) {
                e.preventDefault();
                e.stopPropagation();
                action();
            }, { passive: false });
            
            btn.addEventListener('mousedown', function(e) {
                e.preventDefault();
                action();
            });
        }

        setupMobileButton(mobileJumpBtn, jump);
        setupMobileButton(mobileDashBtn, dash);
        setupMobileButton(mobileAttackBtn, playerAttack);
        setupMobileButton(mobileFlyBtn, toggleFly);
        setupMobileButton(mobileShootBtn, shootArrow);

        // --- Старт ---
        initGame();
        frameId = requestAnimationFrame(gameLoop);

        // --- Регистрация событий ---
        window.addEventListener('keydown', handleKey);
        canvas.addEventListener('click', handleClick);
        canvas.addEventListener('touchstart', function(e) {
            if (e.target === canvas) {
                e.preventDefault();
                if (boss.active && !bossDefeated) {
                    toggleFly();
                } else {
                    jump();
                }
            }
        }, { passive: false });

        document.getElementById('resetBtn').addEventListener('click', resetGame);
        document.getElementById('resetBtn').addEventListener('touchstart', function(e) {
            e.preventDefault();
            resetGame();
        }, { passive: false });

        document.querySelectorAll('.skin-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const skin = this.dataset.skin;
                setSkin(skin);
            });
            btn.addEventListener('touchstart', function(e) {
                e.preventDefault();
                e.stopPropagation();
                const skin = this.dataset.skin;
                setSkin(skin);
            }, { passive: false });
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space' || e.key === 'f' || e.key === 'F' || 
                e.key === 'e' || e.key === 'E' || e.key === 'q' || e.key === 'Q') {
                e.preventDefault();
            }
        });

        window.addEventListener('beforeunload', () => {
            if (frameId) cancelAnimationFrame(frameId);
        });

        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        function resizeCanvas() {
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
    })();
</script>
</body>
</html>
